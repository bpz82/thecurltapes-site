<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — The Curl Tapes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon-light.ico">
<style>
  html,body{margin:0;background:#000;height:100%}
  #welcome-modal{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;opacity:0;transition:opacity 1600ms ease;backdrop-filter:blur(0px)}
  .w-inner{text-align:center;padding:0 20px;max-width:92%;display:flex;flex-direction:column;align-items:center}
  #name-text{font-family:'Times New Roman',Times,serif;font-size:4.4rem;font-weight:700;line-height:1.05;margin:0 0 20px;color:#fff;letter-spacing:-0.02em;opacity:0;transform:scale(0.8);transition:all 900ms cubic-bezier(0.34,1.56,0.64,1)}
  #phrase-text{font-family:'Times New Roman',Times,serif;font-size:2.35rem;font-weight:400;color:#fff;margin:0 0 45px;line-height:1.2;opacity:0;transition:opacity 800ms ease 500ms}
  #logo-container{margin-top:15px;opacity:0;transform:scale(0.85);transition:all 1000ms cubic-bezier(0.34,1.56,0.64,1) 1100ms}
  #logo-container img{height:280px;width:auto;max-width:85vw;filter:brightness(1.05)}
  .w-note{font-family:'Times New Roman',Times,serif;font-size:1.1rem;color:#aaa;opacity:.85;margin-top:50px}
</style>
<script src="/assets/js/config.js"></script>
</head>
<body>
<div id="welcome-modal">
  <div class="w-inner">
    <h1 id="name-text"></h1>
    <p id="phrase-text"></p>
    <div id="logo-container"><img src="/assets/img/blue-faces-welcome.png" alt="The Curl Tapes"></div>
    <div class="w-note">Taking you to our site...</div>
  </div>
</div>
<noscript><p style="color:#fff;font-family:serif;text-align:center;padding-top:40vh"><a style="color:#fff" href="/">Taking you to our site...</a></p></noscript>
<script>
/* Personalised welcome: /welcome?name=First+Last (recreated from the original code block;
   names are inserted with textContent so a crafted link can't inject HTML). */
(function () {
  var CFG = window.CT_CONFIG || {};
  if (CFG.gtmId) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
    var g = document.createElement('script'); g.async = true;
    g.src = 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(CFG.gtmId);
    document.head.appendChild(g);
  }
  var HOME = '/';
  var fullName = new URLSearchParams(location.search).get('name');
  if (!fullName || !fullName.trim()) { location.replace(HOME); return; }
  fullName = fullName.trim();
  var displayName = fullName.split(' ')[0];
  var customPhrase = null;
  var n = fullName.toLowerCase();
  var eggs = [
    ['rustic elegance', 'Rustic Elegance', null],
    ['paul mustard', 'Paul', 'You are truly disturbed'],
    ['julia zuniga', 'Julia', 'Love you Mom'],
    ['raymond zuniga', 'Raymond', 'Love you Dad'],
    ['jack snyder', 'Jack', 'The one and only Sack'],
    ['cecilia landry', 'Cecilia', 'You and Alex mean so much to us.'],
    ['alex debo', 'Alex', 'Thanks for your friendship.'],
    ['sam sosnowski', 'Sam', 'Thank you for the impact you\u2019ve had, couldn\u2019t do it without you bro.']
  ];
  for (var i = 0; i < eggs.length; i++) {
    if (n.indexOf(eggs[i][0]) !== -1) { displayName = eggs[i][1]; customPhrase = eggs[i][2]; break; }
  }
  var phrases = ['We appreciate you!', 'We respect you!', 'Sending our love!', "Hope you're having a good day!", 'Hope to see you soon!', "You're awesome."];
  var modal = document.getElementById('welcome-modal');
  var nameEl = document.getElementById('name-text');
  var phraseEl = document.getElementById('phrase-text');
  var logoEl = document.getElementById('logo-container');
  nameEl.textContent = 'Hey, ' + displayName;
  phraseEl.textContent = customPhrase || phrases[Math.floor(Math.random() * phrases.length)];
  setTimeout(function () { modal.style.opacity = '1'; modal.style.backdropFilter = 'blur(14px)'; }, 200);
  setTimeout(function () { nameEl.style.opacity = '1'; nameEl.style.transform = 'scale(1)'; }, 500);
  setTimeout(function () { phraseEl.style.opacity = '1'; }, 1100);
  setTimeout(function () { logoEl.style.opacity = '1'; logoEl.style.transform = 'scale(1)'; }, 1800);
  setTimeout(function () {
    modal.style.transition = 'opacity 1800ms ease-out, backdrop-filter 1800ms ease-out';
    modal.style.opacity = '0';
    modal.style.backdropFilter = 'blur(0px)';
    setTimeout(function () {
      history.replaceState({}, '', '/');
      document.documentElement.style.transition = 'opacity 1400ms ease-in';
      document.documentElement.style.opacity = '0';
      setTimeout(function () { location.href = HOME; }, 100);
    }, 2200);
  }, 5800);
})();
</script>
</body>
</html>
